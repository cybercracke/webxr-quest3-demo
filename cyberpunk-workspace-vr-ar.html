<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Workspace VR/AR - Quest 3</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Courier New', monospace; overflow: hidden; background: #000; }
        #container { width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 20px; left: 20px; color: #0f0; z-index: 10; background: rgba(0,0,0,0.8); padding: 15px; border: 2px solid #0f0; font-size: 14px; }
        #controls { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 15px; }
        .btn { padding: 12px 24px; font-size: 16px; font-weight: bold; color: #0f0; background: rgba(0,20,0,0.9); border: 2px solid #0f0; cursor: pointer; transition: all 0.3s; text-transform: uppercase; font-family: 'Courier New', monospace; }
        .btn:hover { background: #0f0; color: #000; box-shadow: 0 0 20px #0f0; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #error { position: absolute; top: 100px; left: 20px; padding: 10px; background: rgba(139,0,0,0.9); color: #fff; border: 2px solid #f00; display: none; max-width: 400px; z-index: 10; }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="ui">
        <div>🌐 Cyberpunk Workspace</div>
        <div id="mode">Mode: Desktop</div>
        <div id="status">Status: Ready</div>
    </div>
    <div id="controls">
        <button class="btn" id="vrBtn">Enter VR</button>
        <button class="btn" id="arBtn">Enter AR</button>
    </div>
    <div id="error"></div>

    <script type="importmap">
    { "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js" } }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        
        let scene, camera, renderer;
        let controllers = [], grips = [], raycasters = [];
        let grabbed = {};
        let apps = { calc: null, editor: null };
        let appButtons = [];
        let calcHistory = [], editorHistory = [];
        let dolly;
        let floatingObjects = [];
        let holograms = [];
        let time = 0;
        
        const ui = document.getElementById('ui');
        const modeDiv = document.getElementById('mode');
        const vrBtn = document.getElementById('vrBtn');
        const arBtn = document.getElementById('arBtn');
        const errorDiv = document.getElementById('error');
        
        if ('xr' in navigator) {
            navigator.xr.isSessionSupported('immersive-vr').then(s => { if (!s) vrBtn.disabled = true; });
            navigator.xr.isSessionSupported('immersive-ar').then(s => { if (!s) arBtn.disabled = true; });
        } else {
            vrBtn.disabled = true;
            arBtn.disabled = true;
        }
        
        function showError(msg) {
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
            setTimeout(() => errorDiv.style.display = 'none', 5000);
        }
        
        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
            
            // Dolly for locomotion
            dolly = new THREE.Group();
            dolly.position.set(0, 0, 2);
            dolly.add(camera);
            scene.add(dolly);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.xr.enabled = true;
            document.getElementById('container').appendChild(renderer.domElement);
            
            createCyberpunkRoom();
            createLighting();
            createFloatingObjects();
            createHolograms();
            createAppLaunchers();
            setupControllers();
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            
            renderer.setAnimationLoop(animate);
        }
        
        function createCyberpunkRoom() {
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.Fog(0x050510, 1, 15);
            
            // Floor with hexagon pattern
            const floorGeo = new THREE.PlaneGeometry(10, 10);
            const floorCanvas = document.createElement('canvas');
            floorCanvas.width = 512; floorCanvas.height = 512;
            const fctx = floorCanvas.getContext('2d');
            fctx.fillStyle = '#0a0a15';
            fctx.fillRect(0, 0, 512, 512);
            fctx.strokeStyle = '#1a1a3a';
            fctx.lineWidth = 1;
            for (let i = 0; i < 10; i++) {
                for (let j = 0; j < 10; j++) {
                    const x = i * 51.2;
                    const y = j * 51.2;
                    fctx.beginPath();
                    for (let k = 0; k < 6; k++) {
                        const angle = (k / 6) * Math.PI * 2;
                        const px = x + 25 + Math.cos(angle) * 20;
                        const py = y + 25 + Math.sin(angle) * 20;
                        if (k === 0) fctx.moveTo(px, py);
                        else fctx.lineTo(px, py);
                    }
                    fctx.closePath();
                    fctx.stroke();
                }
            }
            const floorTex = new THREE.CanvasTexture(floorCanvas);
            floorTex.repeat.set(2, 2);
            floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
            const floor = new THREE.Mesh(floorGeo, new THREE.MeshStandardMaterial({ 
                map: floorTex, 
                emissive: 0x0a0a2a, 
                emissiveIntensity: 0.2,
                metalness: 0.8,
                roughness: 0.4
            }));
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);
            
            // Walls with grunge texture
            const wallCanvas = document.createElement('canvas');
            wallCanvas.width = 512; wallCanvas.height = 512;
            const wctx = wallCanvas.getContext('2d');
            wctx.fillStyle = '#0f0f1f';
            wctx.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 200; i++) {
                wctx.fillStyle = `rgba(${Math.random() * 50}, ${Math.random() * 50}, ${Math.random() * 100}, 0.3)`;
                wctx.fillRect(Math.random() * 512, Math.random() * 512, Math.random() * 20, Math.random() * 20);
            }
            const wallTex = new THREE.CanvasTexture(wallCanvas);
            const wallMat = new THREE.MeshStandardMaterial({ 
                map: wallTex,
                color: 0x1a1a2e, 
                emissive: 0x0a0a1a, 
                emissiveIntensity: 0.3,
                roughness: 0.9
            });
            
            const backWall = new THREE.Mesh(new THREE.PlaneGeometry(10, 4), wallMat);
            backWall.position.set(0, 2, -5);
            scene.add(backWall);
            
            const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(10, 4), wallMat.clone());
            leftWall.position.set(-5, 2, 0);
            leftWall.rotation.y = Math.PI / 2;
            scene.add(leftWall);
            
            const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(10, 4), wallMat.clone());
            rightWall.position.set(5, 2, 0);
            rightWall.rotation.y = -Math.PI / 2;
            scene.add(rightWall);
            
            // Desk with RGB edge lighting
            const deskGroup = new THREE.Group();
            const deskTop = new THREE.Mesh(
                new THREE.BoxGeometry(2.5, 0.05, 1.2),
                new THREE.MeshStandardMaterial({ color: 0x1a1a2a, metalness: 0.9, roughness: 0.2 })
            );
            deskGroup.add(deskTop);
            
            // RGB strip around desk
            const rgbColors = [0xff00ff, 0x00ffff, 0xff0080, 0x0080ff];
            for (let i = 0; i < 4; i++) {
                const strip = new THREE.Mesh(
                    new THREE.BoxGeometry(i % 2 === 0 ? 2.5 : 1.2, 0.01, 0.02),
                    new THREE.MeshBasicMaterial({ color: rgbColors[i] })
                );
                if (i === 0) strip.position.set(0, -0.025, 0.6);
                else if (i === 1) strip.position.set(1.25, -0.025, 0);
                else if (i === 2) strip.position.set(0, -0.025, -0.6);
                else strip.position.set(-1.25, -0.025, 0);
                
                if (i % 2 === 1) strip.rotation.y = Math.PI / 2;
                deskGroup.add(strip);
            }
            
            deskGroup.position.set(0, 0.75, -1.8);
            scene.add(deskGroup);
            
            // Multiple monitors on desk
            for (let i = 0; i < 3; i++) {
                const monitorGroup = new THREE.Group();
                
                const screen = new THREE.Mesh(
                    new THREE.BoxGeometry(0.6, 0.4, 0.02),
                    new THREE.MeshStandardMaterial({ color: 0x0a0a0a })
                );
                monitorGroup.add(screen);
                
                // Screen content with scrolling code
                const screenCanvas = document.createElement('canvas');
                screenCanvas.width = 512; screenCanvas.height = 512;
                const sctx = screenCanvas.getContext('2d');
                sctx.fillStyle = '#000';
                sctx.fillRect(0, 0, 512, 512);
                sctx.fillStyle = i === 0 ? '#0f0' : (i === 1 ? '#0ff' : '#f0f');
                sctx.font = '12px Courier';
                const codeLines = [
                    '> SYSTEM ACTIVE',
                    '> Loading modules...',
                    '> Neural link: OK',
                    '> Firewall: ARMED',
                    '> Crypto mining...',
                    '> 01001001 01000001',
                    '> Access granted',
                    '> VR session active'
                ];
                codeLines.forEach((line, idx) => {
                    sctx.fillText(line, 10, 30 + idx * 20);
                });
                
                const screenTex = new THREE.CanvasTexture(screenCanvas);
                const screenDisplay = new THREE.Mesh(
                    new THREE.PlaneGeometry(0.58, 0.38),
                    new THREE.MeshBasicMaterial({ map: screenTex, emissive: i === 0 ? 0x00ff00 : (i === 1 ? 0x00ffff : 0xff00ff), emissiveIntensity: 0.5 })
                );
                screenDisplay.position.z = 0.011;
                screen.add(screenDisplay);
                
                const stand = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.02, 0.02, 0.15, 8),
                    new THREE.MeshStandardMaterial({ color: 0x2a2a2a })
                );
                stand.position.y = -0.275;
                monitorGroup.add(stand);
                
                monitorGroup.position.set(-0.7 + i * 0.7, 1.15, -1.5);
                monitorGroup.rotation.x = -0.2;
                scene.add(monitorGroup);
            }
            
            // Neon strips - more variety
            const neonPositions = [
                { pos: [-4, 2.5, -4.9], color: 0xff00ff, size: [0.05, 2.5, 0.05] },
                { pos: [-2, 2.5, -4.9], color: 0x00ffff, size: [0.05, 2.5, 0.05] },
                { pos: [0, 3.5, -4.9], color: 0xff0080, size: [3, 0.05, 0.05] },
                { pos: [2, 2.5, -4.9], color: 0x0080ff, size: [0.05, 2.5, 0.05] },
                { pos: [4, 2.5, -4.9], color: 0xff00ff, size: [0.05, 2.5, 0.05] },
            ];
            
            neonPositions.forEach(neon => {
                const tube = new THREE.Mesh(
                    new THREE.BoxGeometry(...neon.size),
                    new THREE.MeshBasicMaterial({ color: neon.color })
                );
                tube.position.set(...neon.pos);
                scene.add(tube);
                
                const light = new THREE.PointLight(neon.color, 3, 8);
                light.position.set(...neon.pos);
                scene.add(light);
            });
            
            // Cyberpunk poster on wall
            const posterCanvas = document.createElement('canvas');
            posterCanvas.width = 512; posterCanvas.height = 512;
            const pctx = posterCanvas.getContext('2d');
            const gradient = pctx.createLinearGradient(0, 0, 512, 512);
            gradient.addColorStop(0, '#ff00ff');
            gradient.addColorStop(0.5, '#00ffff');
            gradient.addColorStop(1, '#ff0080');
            pctx.fillStyle = gradient;
            pctx.fillRect(0, 0, 512, 512);
            pctx.fillStyle = '#000';
            pctx.font = 'bold 60px Arial';
            pctx.textAlign = 'center';
            pctx.fillText('CYBER', 256, 200);
            pctx.fillText('PUNK', 256, 280);
            pctx.font = 'bold 30px Arial';
            pctx.fillText('2085', 256, 350);
            
            const poster = new THREE.Mesh(
                new THREE.PlaneGeometry(1.5, 1.5),
                new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(posterCanvas) })
            );
            poster.position.set(-3, 2.5, -4.95);
            scene.add(poster);
            
            // Digital rain particles
            const particlesGeo = new THREE.BufferGeometry();
            const particleCount = 2000;
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            
            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 15;
                positions[i * 3 + 1] = Math.random() * 5;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 15;
                
                const color = Math.random();
                if (color < 0.33) {
                    colors[i * 3] = 1; colors[i * 3 + 1] = 0; colors[i * 3 + 2] = 1; // Magenta
                } else if (color < 0.66) {
                    colors[i * 3] = 0; colors[i * 3 + 1] = 1; colors[i * 3 + 2] = 1; // Cyan
                } else {
                    colors[i * 3] = 0; colors[i * 3 + 1] = 1; colors[i * 3 + 2] = 0; // Green
                }
            }
            
            particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particlesGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            const particlesMat = new THREE.PointsMaterial({
                size: 0.03,
                vertexColors: true,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            });
            
            const particles = new THREE.Points(particlesGeo, particlesMat);
            particles.userData.isParticles = true;
            scene.add(particles);
            
            // Cables on desk
            for (let i = 0; i < 5; i++) {
                const curve = new THREE.CatmullRomCurve3([
                    new THREE.Vector3(-1 + i * 0.5, 0.8, -1.2),
                    new THREE.Vector3(-0.8 + i * 0.4, 0.85, -1.4),
                    new THREE.Vector3(-0.6 + i * 0.3, 0.8, -1.6)
                ]);
                
                const cableGeo = new THREE.TubeGeometry(curve, 20, 0.01, 8, false);
                const cableMat = new THREE.MeshStandardMaterial({ 
                    color: i % 2 === 0 ? 0x1a1a1a : 0x2a2a2a,
                    metalness: 0.8,
                    roughness: 0.3
                });
                const cable = new THREE.Mesh(cableGeo, cableMat);
                scene.add(cable);
            }
        }
        
        function createLighting() {
            scene.add(new THREE.AmbientLight(0x2a2a3a, 0.3));
            
            // Main colored lights
            const lightConfigs = [
                { color: 0xff00ff, pos: [3, 2.5, 3], intensity: 4 },
                { color: 0x00ffff, pos: [-3, 2.5, 3], intensity: 4 },
                { color: 0xff0080, pos: [3, 2.5, -3], intensity: 4 },
                { color: 0x0080ff, pos: [-3, 2.5, -3], intensity: 4 },
                { color: 0x00ff00, pos: [0, 2, -1.5], intensity: 2 }
            ];
            
            lightConfigs.forEach(config => {
                const light = new THREE.PointLight(config.color, config.intensity, 12);
                light.position.set(...config.pos);
                scene.add(light);
            });
            
            // Spotlight on desk
            const spotlight = new THREE.SpotLight(0xffffff, 2, 10, Math.PI / 6, 0.5);
            spotlight.position.set(0, 3.5, -1);
            spotlight.target.position.set(0, 0.75, -1.8);
            scene.add(spotlight);
            scene.add(spotlight.target);
        }
        
        function createFloatingObjects() {
            const geometries = [
                new THREE.BoxGeometry(0.3, 0.3, 0.3),
                new THREE.SphereGeometry(0.2, 32, 32),
                new THREE.ConeGeometry(0.2, 0.4, 32),
                new THREE.TorusGeometry(0.2, 0.08, 16, 100),
                new THREE.OctahedronGeometry(0.2),
                new THREE.TetrahedronGeometry(0.25),
                new THREE.IcosahedronGeometry(0.2),
                new THREE.DodecahedronGeometry(0.2)
            ];
            
            const colors = [
                0xff00ff, 0x00ffff, 0xff0080, 0x0080ff,
                0x00ff00, 0xff6600, 0x6600ff, 0xffff00
            ];
            
            for (let i = 0; i < 8; i++) {
                const material = new THREE.MeshStandardMaterial({
                    color: colors[i],
                    metalness: 0.7,
                    roughness: 0.2,
                    emissive: colors[i],
                    emissiveIntensity: 0.4,
                    transparent: true,
                    opacity: 0.8
                });
                
                const mesh = new THREE.Mesh(geometries[i], material);
                
                const angle = (i / 8) * Math.PI * 2;
                const radius = 3;
                mesh.position.set(
                    Math.cos(angle) * radius,
                    2 + Math.sin(i) * 0.3,
                    Math.sin(angle) * radius
                );
                
                mesh.userData = {
                    initialY: mesh.position.y,
                    rotationSpeed: 0.003 + Math.random() * 0.005,
                    floatSpeed: 0.3 + Math.random() * 0.3,
                    floatOffset: Math.random() * Math.PI * 2,
                    floatAmplitude: 0.2
                };
                
                scene.add(mesh);
                floatingObjects.push(mesh);
                
                // Add point light for each object
                const light = new THREE.PointLight(colors[i], 1.5, 5);
                light.position.copy(mesh.position);
                mesh.userData.light = light;
                scene.add(light);
            }
        }
        
        function createHolograms() {
            // Hologram 1: Stats panel
            const holo1 = createHologramPanel(
                'SYSTEM STATUS',
                [
                    'CPU: 67%',
                    'RAM: 8.2/16 GB',
                    'NET: 1.2 Gb/s',
                    'TEMP: 42°C'
                ],
                0x00ffff
            );
            holo1.position.set(-2.5, 2, 1);
            holo1.rotation.y = Math.PI / 4;
            scene.add(holo1);
            holograms.push(holo1);
            
            // Hologram 2: Neural interface
            const holo2 = createHologramPanel(
                'NEURAL LINK',
                [
                    'Status: ACTIVE',
                    'Sync: 98.7%',
                    'Latency: 2ms',
                    'Bandwidth: OK'
                ],
                0xff00ff
            );
            holo2.position.set(2.5, 2, 1);
            holo2.rotation.y = -Math.PI / 4;
            scene.add(holo2);
            holograms.push(holo2);
            
            // Hologram 3: Crypto ticker
            const holo3 = createHologramPanel(
                'CRYPTO FEED',
                [
                    'BTC: $67,420',
                    'ETH: $3,245',
                    'SOL: $142',
                    'ADA: $0.58'
                ],
                0x00ff00
            );
            holo3.position.set(0, 2.5, -3);
            scene.add(holo3);
            holograms.push(holo3);
            
            // Floating holographic rings
            for (let i = 0; i < 3; i++) {
                const ringGeo = new THREE.TorusGeometry(0.4, 0.02, 16, 100);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: i === 0 ? 0xff00ff : (i === 1 ? 0x00ffff : 0x00ff00),
                    transparent: true,
                    opacity: 0.4,
                    side: THREE.DoubleSide
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.position.set(-3 + i * 3, 2.5, -2);
                ring.userData = {
                    rotationSpeed: 0.002 + i * 0.001,
                    floatSpeed: 0.2,
                    floatOffset: i * Math.PI / 1.5,
                    initialY: 2.5,
                    isHologramRing: true
                };
                scene.add(ring);
                holograms.push(ring);
            }
        }
        
        function createHologramPanel(title, lines, color) {
            const group = new THREE.Group();
            
            // Background panel
            const panel = new THREE.Mesh(
                new THREE.PlaneGeometry(0.8, 0.6),
                new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0.15,
                    side: THREE.DoubleSide
                })
            );
            group.add(panel);
            
            // Border
            const borderGeo = new THREE.EdgesGeometry(new THREE.PlaneGeometry(0.8, 0.6));
            const borderMat = new THREE.LineBasicMaterial({ color: color });
            const border = new THREE.LineSegments(borderGeo, borderMat);
            group.add(border);
            
            // Text content
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0,0,0,0)';
            ctx.fillRect(0, 0, 512, 512);
            
            // Title
            ctx.fillStyle = `#${color.toString(16).padStart(6, '0')}`;
            ctx.font = 'bold 40px Courier';
            ctx.textAlign = 'center';
            ctx.fillText(title, 256, 80);
            
            // Lines
            ctx.font = '28px Courier';
            ctx.textAlign = 'left';
            lines.forEach((line, i) => {
                ctx.fillText(line, 60, 160 + i * 50);
            });
            
            const textTex = new THREE.CanvasTexture(canvas);
            const textMesh = new THREE.Mesh(
                new THREE.PlaneGeometry(0.78, 0.58),
                new THREE.MeshBasicMaterial({ 
                    map: textTex, 
                    transparent: true,
                    opacity: 0.9
                })
            );
            textMesh.position.z = 0.001;
            group.add(textMesh);
            
            group.userData = {
                floatSpeed: 0.15,
                floatOffset: Math.random() * Math.PI * 2,
                initialY: group.position.y,
                pulseSpeed: 0.5,
                isHologram: true
            };
            
            return group;
        }
        
        function createAppLaunchers() {
            const btnData = [
                { name: 'Calculator', icon: '🔢', pos: [-0.5, 1.3, 0.8], color: 0x00ff00 },
                { name: 'Editor', icon: '📝', pos: [0.5, 1.3, 0.8], color: 0x00ffff }
            ];
            
            btnData.forEach(data => {
                const group = new THREE.Group();
                
                const btn = new THREE.Mesh(
                    new THREE.BoxGeometry(0.4, 0.4, 0.1),
                    new THREE.MeshStandardMaterial({ 
                        color: data.color, 
                        emissive: data.color, 
                        emissiveIntensity: 0.5,
                        metalness: 0.8,
                        roughness: 0.2
                    })
                );
                group.add(btn);
                
                const canvas = document.createElement('canvas');
                canvas.width = 256; canvas.height = 256;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 120px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(data.icon, 128, 128);
                
                const icon = new THREE.Mesh(
                    new THREE.PlaneGeometry(0.3, 0.3),
                    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true })
                );
                icon.position.z = 0.051;
                group.add(icon);
                
                group.position.set(...data.pos);
                group.userData = { 
                    type: 'launcher', 
                    app: data.name.toLowerCase(),
                    grabbable: true
                };
                
                scene.add(group);
                appButtons.push(group);
            });
        }
        
        function createCalculator(pos) {
            if (apps.calc) {
                // Cleanup old calculator
                apps.calc.traverse(child => {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) {
                        if (child.material.map) child.material.map.dispose();
                        child.material.dispose();
                    }
                });
                scene.remove(apps.calc);
            }
            
            const group = new THREE.Group();
            let display = '0';
            let memory = 0;
            let operator = null;
            let newNumber = true;
            
            group.add(new THREE.Mesh(
                new THREE.BoxGeometry(0.6, 0.8, 0.05),
                new THREE.MeshStandardMaterial({ color: 0x1a1a2a, metalness: 0.7, roughness: 0.3 })
            ));
            
            const dispCanvas = document.createElement('canvas');
            dispCanvas.width = 512; dispCanvas.height = 128;
            const dispCtx = dispCanvas.getContext('2d');
            const dispTex = new THREE.CanvasTexture(dispCanvas);
            
            function updateDisplay() {
                dispCtx.fillStyle = '#0a0a1a';
                dispCtx.fillRect(0, 0, 512, 128);
                dispCtx.fillStyle = '#0f0';
                dispCtx.font = 'bold 48px Courier';
                dispCtx.textAlign = 'right';

                dispCtx.fillText(display.slice(-12), 500, 64);

            }
            
            const dispMesh = new THREE.Mesh(

            const btnLayout = [
                ['C', '√', '%', '/'],
                ['7', '8', '9', '*'],
                ['4', '5', '6', '-'],
                ['1', '2', '3', '+'],
                ['0', '.', 'log', '=']
            ];
            
            const btnSize = 0.1;
            const spacing = 0.12;
            
            btnLayout.forEach((row, r) => {
                row.forEach((label, c) => {
                    const btn = new THREE.Mesh(
                        new THREE.BoxGeometry(btnSize, btnSize, 0.02),
                        new THREE.MeshStandardMaterial({ 
                            color: label === '=' ? 0x00ff00 : 0x2a2a4a,
                            emissive: label === '=' ? 0x00ff00 : 0x0a0a1a,

                        })
                    );
                    
                    btn.position.set(-0.18 + c * spacing, 0.1 - r * spacing, 0.036);
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = 128; canvas.height = 128;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 60px Courier';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(label, 64, 64);
                    
                    const labelMesh = new THREE.Mesh(
                        new THREE.PlaneGeometry(btnSize * 0.8, btnSize * 0.8),

                    );
                    labelMesh.position.z = 0.011;
                    btn.add(labelMesh);
                    
                    btn.userData = { 
                        type: 'calcBtn', 
                        onClick: () => handleCalcInput(label)
                    };
                    
                    group.add(btn);
                });
            });
            
            function handleCalcInput(input) {
                if (input >= '0' && input <= '9') {
                    display = newNumber ? input : (display === '0' ? input : display + input);
                    newNumber = false;
                } else if (input === '.') {
                    if (!display.includes('.')) display += '.';
                } else if (input === 'C') {
                    display = '0';
                    memory = 0;
                    operator = null;
                    newNumber = true;
                } else if (input === '√') {
                    display = String(Math.sqrt(parseFloat(display)));
                    newNumber = true;
                } else if (input === 'log') {
                    display = String(Math.log10(parseFloat(display)));
                    newNumber = true;
                } else if (input === '%') {
                    display = String(parseFloat(display) / 100);
                    newNumber = true;
                } else if (['+', '-', '*', '/'].includes(input)) {
                    if (operator && !newNumber) {
                        const result = calculate(memory, parseFloat(display), operator);
                        display = String(result);
                        memory = result;
                    } else {
                        memory = parseFloat(display);
                    }
                    operator = input;
                    newNumber = true;
                } else if (input === '=') {
                    if (operator) {
                        const result = calculate(memory, parseFloat(display), operator);
                        display = String(result);
                        calcHistory.push(`${memory} ${operator} ${parseFloat(display)} = ${result}`);
                        memory = 0;
                        operator = null;
                        newNumber = true;
                    }
                }
                updateDisplay();
            }
            
            function calculate(a, b, op) {
                switch(op) {
                    case '+': return a + b;
                    case '-': return a - b;
                    case '*': return a * b;
                    case '/': return b !== 0 ? a / b : 0;
                    default: return b;
                }
            }

            const group = new THREE.Group();
            let text = '';
            let cursorPos = 0;
            let capsLock = false;
            let shiftActive = false;
            
            group.add(new THREE.Mesh(
                new THREE.BoxGeometry(1.2, 1, 0.05),
                new THREE.MeshStandardMaterial({ color: 0x1a1a2a, metalness: 0.7, roughness: 0.3 })
            ));
            
            const textCanvas = document.createElement('canvas');
            textCanvas.width = 1024; textCanvas.height = 512;
            const textCtx = textCanvas.getContext('2d');
            const textTex = new THREE.CanvasTexture(textCanvas);
            
            function updateTextDisplay() {
                textCtx.fillStyle = '#1a1a2a';
                textCtx.fillRect(0, 0, 1024, 512);
                textCtx.fillStyle = '#ffffff';
                textCtx.font = '24px Courier';

                lines.forEach((line, i) => {
                    textCtx.fillText(line, 10, 10 + i * lineHeight);
                });
                
                // Cursor
                let charCount = 0;
                let cursorX = 10;
                let cursorY = 10;
                
                for (let i = 0; i < lines.length; i++) {
                    if (charCount + lines[i].length >= cursorPos) {
                        cursorX = 10 + (cursorPos - charCount) * charWidth;
                        cursorY = 10 + i * lineHeight;
                        break;
                    }
                    charCount += lines[i].length + 1;

                textCtx.fillStyle = '#0f0';

                enterKey.position.set(0.25, -keys.length * spacing, 0);

                kbGroup.add(enterKey);
                
                // Shift
                const shiftKey = new THREE.Mesh(
                    new THREE.BoxGeometry(0.12, keySize, 0.02),
                    new THREE.MeshStandardMaterial({ color: 0x4a4a6a })

                shiftKey.position.set(-0.4, -keys.length * spacing, 0);
                shiftKey.userData = { 
                    type: 'keyBtn', 
                    onClick: () => {
                        shiftActive = !shiftActive;
                        Object.values(keyMeshes).forEach(k => k.userData.updateLabel && k.userData.updateLabel());
                    }
                };
                kbGroup.add(shiftKey);
                
                // CapsLock
                const capsKey = new THREE.Mesh(
                    new THREE.BoxGeometry(0.12, keySize, 0.02),

                );
                capsKey.position.set(0.4, -keys.length * spacing, 0);
                capsKey.userData = {

                        capsLock = !capsLock;
                        capsKey.material.color.setHex(capsLock ? 0x00ff00 : 0x4a4a6a);
                        Object.values(keyMeshes).forEach(k => k.userData.updateLabel && k.userData.updateLabel());
                    }
                };
                kbGroup.add(capsKey);
                
                // Arrow keys
                const arrowY = -(keys.length + 1) * spacing;
                const arrows = [
                    { key: '←', pos: [-0.2, arrowY, 0] },
                    { key: '↑', pos: [-0.13, arrowY + 0.065, 0] },
                    { key: '↓', pos: [-0.13, arrowY, 0] },
                    { key: '→', pos: [-0.06, arrowY, 0] }
                ];
                
                arrows.forEach(arrow => {
                    const arrowKey = new THREE.Mesh(

            function handleKeyPress(key) {
                if (key === '⌫') {
                    if (cursorPos > 0) {
                        text = text.slice(0, cursorPos - 1) + text.slice(cursorPos);
                        cursorPos--;
                    }
                } else if (key === '\n') {
                    text = text.slice(0, cursorPos) + '\n' + text.slice(cursorPos);
                    cursorPos++;
                } else {
                    let char = key;
                    if (key.match(/[A-Z]/) && !capsLock && !shiftActive) {
                        char = key.toLowerCase();
                    }
                    text = text.slice(0, cursorPos) + char + text.slice(cursorPos);
                    cursorPos++;
                    if (shiftActive) {
                        shiftActive = false;
                        Object.values(keyboard.children).forEach(k => {
                            if (k.userData.updateLabel) k.userData.updateLabel();
                        });
                    }
                }
                editorHistory.push(text);
                updateTextDisplay();
            }
            
            function handleArrow(dir) {
                const lines = text.split('\n');
                let lineIdx = 0;
                let charCount = 0;
                
                for (let i = 0; i < lines.length; i++) {
                    if (charCount + lines[i].length >= cursorPos) {
                        lineIdx = i;
                        break;
                    }
                    charCount += lines[i].length + 1;
                }
                
                const colPos = cursorPos - charCount;
                
                if (dir === '←' && cursorPos > 0) cursorPos--;
                else if (dir === '→' && cursorPos < text.length) cursorPos++;
                else if (dir === '↑' && lineIdx > 0) {
                    const prevLineStart = charCount - lines[lineIdx - 1].length - 1;
                    cursorPos = Math.min(prevLineStart + colPos, prevLineStart + lines[lineIdx - 1].length);
                } else if (dir === '↓' && lineIdx < lines.length - 1) {
                    const nextLineStart = charCount + lines[lineIdx].length + 1;
                    cursorPos = Math.min(nextLineStart + colPos, nextLineStart + lines[lineIdx + 1].length);
                }
                
                updateTextDisplay();
            }

        function downloadHistory(type) {
            const content = type === 'calculator' ? calcHistory.join('\n') : editorHistory[editorHistory.length - 1] || '';
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${type}_log.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        function setupControllers() {
            for (let i = 0; i < 2; i++) {
                const controller = renderer.xr.getController(i);
                controller.userData.index = i;
                dolly.add(controller);
                
                const line = new THREE.Line(
                    new THREE.BufferGeometry().setFromPoints([
                        new THREE.Vector3(0, 0, 0),
                        new THREE.Vector3(0, 0, -1)
                    ]),
                    new THREE.LineBasicMaterial({ color: i === 0 ? 0xff0066 : 0x0066ff })
                );
                line.scale.z = 5;
                controller.add(line);
                
                const grip = renderer.xr.getControllerGrip(i);
                const gripMesh = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.02, 0.03, 0.1, 8),
                    new THREE.MeshStandardMaterial({ color: i === 0 ? 0xff0066 : 0x0066ff })
                );
                gripMesh.rotation.x = Math.PI / 2;
                grip.add(gripMesh);
                dolly.add(grip);
                
                controllers.push(controller);
                grips.push(grip);
                raycasters.push(new THREE.Raycaster());
                
                controller.addEventListener('selectstart', () => onSelectStart(i));
                controller.addEventListener('squeezestart', () => onSqueezeStart(i));
                controller.addEventListener('squeezeend', () => onSqueezeEnd(i));
            }
        }
        
        function onSelectStart(i) {
            const tempMatrix = new THREE.Matrix4();
            const controller = controllers[i];
            const raycaster = raycasters[i];
            
            if (!controller) return;
            
            tempMatrix.identity().extractRotation(controller.matrixWorld);
            raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
            raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
            
            const allObjects = [...appButtons];
            if (apps.calc && apps.calc.parent) {
                const calcButtons = apps.calc.children.filter(c => c.userData && c.userData.type);
                allObjects.push(...calcButtons);
            }
            if (apps.editor && apps.editor.parent) {
                const editorButtons = apps.editor.children.filter(c => c.userData && c.userData.type);
                allObjects.push(...editorButtons);
            }
            
            const validObjects = allObjects.filter(obj => obj && obj.parent);
            if (validObjects.length === 0) return;
            
            const intersects = raycaster.intersectObjects(validObjects, true);
            
            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj.parent && !obj.userData.type) obj = obj.parent;
                
                if (obj.userData && obj.userData.onClick) {
                    obj.userData.onClick();
                } else if (obj.userData && obj.userData.type === 'launcher') {
                    const app = obj.userData.app;
                    if (app === 'calculator') createCalculator([0, 1.3, 0.5]);
                    else if (app === 'editor') createEditor([0, 1.3, 0.5]);
                }
            }
        }
        
        function onSqueezeStart(i) {
            const tempMatrix = new THREE.Matrix4();
            const controller = controllers[i];
            const raycaster = raycasters[i];
            
            if (!controller) return;
            
            tempMatrix.identity().extractRotation(controller.matrixWorld);
            raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
            raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
            
            const grabbableObjects = [...appButtons];
            if (apps.calc && apps.calc.parent && apps.calc.userData.grabbable) {
                grabbableObjects.push(apps.calc);
            }
            if (apps.editor && apps.editor.parent && apps.editor.userData.grabbable) {
                grabbableObjects.push(apps.editor);
            }
            
            const validObjects = grabbableObjects.filter(obj => obj && obj.parent);
            if (validObjects.length === 0) return;
            
            const intersects = raycaster.intersectObjects(validObjects, true);
            
            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj.parent && !obj.userData.grabbable) obj = obj.parent;
                
                if (obj.userData && obj.userData.grabbable) {
                    grabbed[i] = obj;
                    controller.attach(obj);
                }
            }
        }
        
        function onSqueezeEnd(i) {
            const obj = grabbed[i];
            if (obj && obj.parent) {
                scene.attach(obj);
            }
            delete grabbed[i];
        }
        
        function updateLocomotion() {
            const session = renderer.xr.getSession();
            if (!session) return;
            
            for (let i = 0; i < session.inputSources.length; i++) {
                const inputSource = session.inputSources[i];
                const gamepad = inputSource.gamepad;
                
                if (gamepad && gamepad.axes.length >= 4) {
                    if (inputSource.handedness === 'right') {
                        // Right stick - locomotion
                        const x = gamepad.axes[2];
                        const y = gamepad.axes[3];
                        
                        if (Math.abs(x) > 0.1 || Math.abs(y) > 0.1) {
                            const speed = 0.05;
                            const angle = dolly.rotation.y;
                            dolly.position.x += (x * Math.cos(angle) - y * Math.sin(angle)) * speed;
                            dolly.position.z += (x * Math.sin(angle) + y * Math.cos(angle)) * speed;
                        }
                    } else if (inputSource.handedness === 'left') {
                        // Left stick - rotation
                        const x = gamepad.axes[2];
                        
                        if (Math.abs(x) > 0.1) {
                            dolly.rotation.y -= x * 0.02;
                        }
                    }
                }
            }
        }
        
        async function switchMode(mode) {
            try {
                const currentSession = renderer.xr.getSession();
                if (currentSession) await currentSession.end();
                
                await new Promise(r => setTimeout(r, 100));
                
                if (mode === 'vr') {
                    scene.background = new THREE.Color(0x0a0a1a);
                    const session = await navigator.xr.requestSession('immersive-vr', {
                        optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking']
                    });
                    await renderer.xr.setSession(session);
                    modeDiv.textContent = 'Mode: VR';
                    ui.style.display = 'none';
                    document.getElementById('controls').style.display = 'none';
                } else if (mode === 'ar') {
                    scene.background = null;
                    const session = await navigator.xr.requestSession('immersive-ar', {
                        requiredFeatures: ['local-floor'],
                        optionalFeatures: ['hand-tracking']
                    });
                    await renderer.xr.setSession(session);
                    modeDiv.textContent = 'Mode: AR';
                    ui.style.display = 'none';
                    document.getElementById('controls').style.display = 'none';
                }
            } catch (err) {
                showError('Error: ' + err.message);
            }
        }
        
        vrBtn.addEventListener('click', () => switchMode('vr'));
        arBtn.addEventListener('click', () => switchMode('ar'));
        
        function animate() {
            time += 0.005; // Slow time increment
            
            updateLocomotion();
            
            // Animate floating objects (slow and smooth)
            floatingObjects.forEach(obj => {
                if (!obj.parent) return; // Skip if removed from scene
                
                const isGrabbed = Object.values(grabbed).includes(obj);
                if (!isGrabbed) {
                    // Smooth rotation
                    obj.rotation.x += obj.userData.rotationSpeed;
                    obj.rotation.y += obj.userData.rotationSpeed * 1.3;
                    
                    // Smooth floating
                    obj.position.y = obj.userData.initialY + 
                        Math.sin(time * obj.userData.floatSpeed + obj.userData.floatOffset) * obj.userData.floatAmplitude;
                    
                    // Update light position
                    if (obj.userData.light && obj.userData.light.parent) {
                        obj.userData.light.position.copy(obj.position);
                    }
                }
            });
            
            // Animate holograms (very slow and smooth)
            holograms.forEach(holo => {
                if (!holo.parent) return; // Skip if removed from scene
                
                if (holo.userData.isHologram) {
                    // Gentle float
                    holo.position.y = holo.userData.initialY + 
                        Math.sin(time * holo.userData.floatSpeed + holo.userData.floatOffset) * 0.1;
                    
                    // Gentle pulse opacity
                    const pulse = Math.sin(time * holo.userData.pulseSpeed) * 0.1 + 0.9;
                    holo.children.forEach(child => {
                        if (child.material && child.material.opacity !== undefined) {
                            if (child.material.map) {
                                child.material.opacity = pulse * 0.9;
                            } else {
                                child.material.opacity = pulse * 0.15;
                            }
                        }
                    });
                } else if (holo.userData.isHologramRing) {
                    // Slow rotation
                    holo.rotation.x += holo.userData.rotationSpeed;
                    holo.rotation.y += holo.userData.rotationSpeed * 0.7;
                    
                    // Gentle float
                    holo.position.y = holo.userData.initialY + 
                        Math.sin(time * holo.userData.floatSpeed + holo.userData.floatOffset) * 0.15;
                }
            });
            
            // Animate digital rain particles (slower)
            scene.children.forEach(child => {
                if (child.userData.isParticles) {
                    const positions = child.geometry.attributes.position.array;
                    for (let i = 0; i < positions.length; i += 3) {
                        positions[i + 1] -= 0.005; // Much slower fall
                        if (positions[i + 1] < 0) {
                            positions[i + 1] = 5; // Reset to top
                        }
                    }
                    child.geometry.attributes.position.needsUpdate = true;
                    child.rotation.y += 0.0002; // Slower rotation
                }
            });
            
            renderer.render(scene, camera);
        }
        
        init();
    </script>
</body>
</html>
